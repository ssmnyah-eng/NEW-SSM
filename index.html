<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nyah Samone | Roofing Marketing Specialist</title></head>
<body><p id="status" style="font:16px Arial,sans-serif;padding:2rem">Loading website…</p>
<script>
(async()=>{try{
 const count=20;
 const parts=await Promise.all(Array.from({length:count},(_,i)=>fetch('./site-src/part-'+String(i).padStart(2,'0')+'.txt').then(r=>{if(!r.ok)throw new Error('Could not load source segment '+(i+1));return r.text();})));
 document.open();document.write(parts.join(''));document.close();
}catch(e){document.getElementById('status').textContent='Website failed to load: '+e.message;}})();
</script></body></html>
